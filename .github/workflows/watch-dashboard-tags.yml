name: Watch private dashboard tags

run-name: Scan private dashboard tags

on:
  schedule:
    # Avoid the start of the hour, when scheduled Actions are more likely to
    # be delayed. GitHub's minimum schedule interval is five minutes.
    - cron: "3/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dashboard-tag-watcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  scan:
    name: Scan latest release tag
    runs-on: ubuntu-24.04
    environment: private-source
    steps:
      - name: Create short-lived private source token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DASHBOARD_APP_ID }}
          private-key: ${{ secrets.DASHBOARD_APP_PRIVATE_KEY }}
          owner: andless-tech
          repositories: dashboard
          permission-contents: read

      - name: Find latest private dashboard version tag
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          mapfile -t VERSION_TAGS < <(
            gh api --paginate "repos/andless-tech/dashboard/tags?per_page=100" \
              --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' \
              | sort -V -r
          )

          if [[ "${#VERSION_TAGS[@]}" -eq 0 ]]; then
            echo "No v-prefixed semantic version tags found"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG="${VERSION_TAGS[0]}"
          echo "Latest private dashboard tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for an existing build
        if: steps.latest.outputs.tag != ''
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail

          EXPECTED_TITLE="Build dashboard ${RELEASE_TAG} as ${RELEASE_TAG}"
          MATCH_COUNT="$(
            gh api --paginate \
              "repos/andless-tech/dashboard-build/actions/workflows/build-dashboard.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].display_title' \
              | grep -Fxc "$EXPECTED_TITLE" \
              || true
          )"

          if [[ "$MATCH_COUNT" -gt 0 ]]; then
            echo "Build already exists for $RELEASE_TAG"
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          else
            echo "No build found for $RELEASE_TAG"
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch dashboard build
        if: steps.existing.outputs.should_dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run build-dashboard.yml \
            --repo andless-tech/dashboard-build \
            --ref main \
            -f source_ref="$RELEASE_TAG" \
            -f release_tag="$RELEASE_TAG"
          echo "Dispatched dashboard build for $RELEASE_TAG"
