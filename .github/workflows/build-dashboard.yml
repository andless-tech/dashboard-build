name: Build private dashboard

run-name: Build dashboard ${{ inputs.source_ref }}${{ inputs.release_tag != '' && format(' as {0}', inputs.release_tag) || '' }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private dashboard ref (main, a 40-character commit SHA, or a v-prefixed version tag)
        required: true
        default: main
        type: string
      release_tag:
        description: Optional public release tag such as v0.1.0; leave empty to produce Actions artifacts only
        required: false
        default: ""
        type: string
      publish_existing:
        description: Publish an existing versioned OSS manifest without rebuilding installers
        required: false
        default: false
        type: boolean

concurrency:
  group: dashboard-build-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate request
    runs-on: ubuntu-24.04
    steps:
      - name: Validate source and release refs
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_EXISTING: ${{ inputs.publish_existing }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_REF" != "main" \
            && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ \
            && ! "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::source_ref must be main, a full commit SHA, or a v-prefixed version tag"
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" \
            && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be empty or a v-prefixed version tag"
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$SOURCE_REF" != "$RELEASE_TAG" ]]; then
            echo "::error::A release build must use the same version tag for source_ref and release_tag"
            exit 1
          fi

          if [[ "$PUBLISH_EXISTING" == "true" && -z "$RELEASE_TAG" ]]; then
            echo "::error::publish_existing requires release_tag"
            exit 1
          fi

  resolve:
    name: Resolve private source
    needs: validate
    runs-on: ubuntu-24.04
    environment: private-source
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      force_update: ${{ steps.metadata.outputs.force_update }}
    steps:
      - name: Create short-lived private source token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DASHBOARD_APP_ID }}
          private-key: ${{ secrets.DASHBOARD_APP_PRIVATE_KEY }}
          owner: andless-tech
          repositories: dashboard
          permission-contents: read

      - name: Checkout private dashboard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: andless-tech/dashboard
          ref: ${{ inputs.source_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Resolve immutable metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          FORCE_UPDATE="false"
          if [[ -n "$RELEASE_TAG" ]]; then
            APP_VERSION="${RELEASE_TAG#v}"

            TAG_REF="$(
              gh api "repos/andless-tech/dashboard/git/ref/tags/$SOURCE_REF"
            )"
            if [[ "$(jq -r '.object.type' <<< "$TAG_REF")" == "tag" ]]; then
              TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$TAG_REF")"
              TAG_MESSAGE="$(
                gh api "repos/andless-tech/dashboard/git/tags/$TAG_OBJECT_SHA" \
                  --jq '.message'
              )"
              if grep -qiF '[force]' <<< "$TAG_MESSAGE"; then
                FORCE_UPDATE="true"
                echo "Version tag requests a forced update"
              fi
            fi
          else
            APP_VERSION="$(jq -r '.version' source/src-tauri/tauri.conf.json)"
          fi

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid application version in tauri.conf.json"
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "force_update=$FORCE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "Resolved private source to $SOURCE_SHA (dashboard $APP_VERSION)"

  build:
    name: Build ${{ matrix.name }}
    if: inputs.publish_existing != true
    needs:
      - validate
      - resolve
    runs-on: ${{ matrix.os }}
    environment: private-source
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            artifact_name: dashboard-linux-x64
            artifact_path: |
              source/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              source/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

          - name: macOS Intel
            os: macos-15
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg
            artifact_name: dashboard-macos-intel
            artifact_path: source/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: dashboard-macos-apple-silicon
            artifact_path: source/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
            artifact_name: dashboard-windows-x64
            artifact_path: source/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Create short-lived private source token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DASHBOARD_APP_ID }}
          private-key: ${{ secrets.DASHBOARD_APP_PRIVATE_KEY }}
          owner: andless-tech
          repositories: dashboard
          permission-contents: read

      - name: Checkout immutable private dashboard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: andless-tech/dashboard
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Private source commit changed during checkout"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set application version from release tag
        if: inputs.release_tag != ''
        shell: bash
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          APP_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$APP_VERSION" node -e '
            const fs = require("node:fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.APP_VERSION;
            fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          '
          echo "Set application version to $APP_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup protoc (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROTOC_VERSION: "23.4"
        run: |
          set -euo pipefail
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip" ;;
            macOS/ARM64) ARCHIVE="protoc-${PROTOC_VERSION}-osx-aarch_64.zip" ;;
            macOS/X64) ARCHIVE="protoc-${PROTOC_VERSION}-osx-x86_64.zip" ;;
            *) echo "::error::Unsupported protoc host ${RUNNER_OS}/${RUNNER_ARCH}"; exit 1 ;;
          esac
          INSTALL_DIR="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ARCHIVE}"
          unzip -q "${RUNNER_TEMP}/${ARCHIVE}" -d "$INSTALL_DIR"
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/bin/protoc" --version

      - name: Setup protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROTOC_VERSION: "23.4"
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "protoc-$env:PROTOC_VERSION-win64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOC_VERSION"
          & curl.exe --fail --location --retry 5 --retry-all-errors `
            --output $archivePath `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          (Join-Path $installDir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $installDir 'bin/protoc.exe') --version

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libhidapi-dev \
            libudev-dev

      - name: Install frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        working-directory: source
        env:
          CI: "true"
          # CMake 4 removed compatibility with policy versions below 3.5.
          # audiopus_sys 0.2.2 bundles an older Opus CMake project, so provide
          # the compatibility floor without modifying the private source.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: pnpm tauri build --ci ${{ matrix.tauri_args }}

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    if: inputs.release_tag != '' && inputs.publish_existing != true
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Generate checksums and build metadata
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_repository "andless-tech/dashboard" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg app_version "$APP_VERSION" \
            '{
              source_repository: $source_repository,
              source_ref: $source_ref,
              source_sha: $source_sha,
              app_version: $app_version
            }' > release-artifacts/BUILD-METADATA.json

          (
            cd release-artifacts
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Create or replace draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail

          IS_DRAFT="false"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq '.isDraft'
            )"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Refusing to replace published release $RELEASE_TAG"
              exit 1
            fi

            mapfile -t EXISTING_ASSETS < <(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )
            for ASSET in "${EXISTING_ASSETS[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$ASSET" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            done
          fi

          mapfile -d '' FILES < <(find release-artifacts -type f -print0 | sort -z)
          RELEASE_NOTES="Built from private source commit \`$SOURCE_SHA\`. Verify downloaded files against \`SHA256SUMS\`."

          if [[ "$IS_DRAFT" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Dashboard $APP_VERSION" \
              --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${FILES[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Dashboard $APP_VERSION" \
              --notes "$RELEASE_NOTES" \
              "${FILES[@]}"
          fi

  publish:
    name: Publish to OSS and MQTT
    if: inputs.release_tag != '' && inputs.publish_existing != true
    timeout-minutes: 60
    needs:
      - resolve
      - build
      - release
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: read
    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Prepare versioned release manifest
        id: release-meta
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          FORCE_UPDATE: ${{ needs.resolve.outputs.force_update }}
        run: bash scripts/prepare-dashboard-release.sh

      - name: Install ossutil v2
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_VERSION="2.2.1"
          ARCHIVE="$RUNNER_TEMP/ossutil-${OSSUTIL_VERSION}.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$ARCHIVE" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          OSSUTIL_DIR="$RUNNER_TEMP/ossutil-${OSSUTIL_VERSION}-linux-amd64"
          test -x "$OSSUTIL_DIR/ossutil"
          echo "$OSSUTIL_DIR" >> "$GITHUB_PATH"
          "$OSSUTIL_DIR/ossutil" version

      - name: Upload immutable release to OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          VERSION_DIR: ${{ steps.release-meta.outputs.version_dir }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?Missing OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?Missing OSS_ACCESS_KEY_SECRET}"
          : "${OSS_BUCKET:?Missing OSS_BUCKET}"
          : "${OSS_ENDPOINT:?Missing OSS_ENDPOINT}"

          ENDPOINT_HOST="${OSS_ENDPOINT#http://}"
          ENDPOINT_HOST="${ENDPOINT_HOST#https://}"
          ENDPOINT_HOST="${ENDPOINT_HOST%/}"
          REGION="${ENDPOINT_HOST#oss-}"
          REGION="${REGION%%.*}"

          for FILE in release-files/*; do
            DESTINATION="oss://${OSS_BUCKET}/${VERSION_DIR}/$(basename "$FILE")"
            echo "Uploading $(basename "$FILE") ($(stat -c%s "$FILE") bytes)"
            ossutil cp "$FILE" "$DESTINATION" \
              --endpoint="$OSS_ENDPOINT" \
              --region="$REGION" \
              --force \
              --connect-timeout=15 \
              --read-timeout=120 \
              --retry-times=5
          done
          ossutil cp manifest.json \
            "oss://${OSS_BUCKET}/${VERSION_DIR}/manifest.json" \
            --endpoint="$OSS_ENDPOINT" \
            --region="$REGION" \
            --force

      - name: Publish latest manifest
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          ENDPOINT_HOST="${OSS_ENDPOINT#http://}"
          ENDPOINT_HOST="${ENDPOINT_HOST#https://}"
          ENDPOINT_HOST="${ENDPOINT_HOST%/}"
          REGION="${ENDPOINT_HOST#oss-}"
          REGION="${REGION%%.*}"

          ossutil cp manifest.json \
            "oss://${OSS_BUCKET}/dashboard/release/latest.json" \
            --endpoint="$OSS_ENDPOINT" \
            --region="$REGION" \
            --force

      - name: Announce new version via MQTT
        shell: bash
        env:
          MQTT_BROKER_HOST: ${{ secrets.MQTT_BROKER_HOST }}
          MQTT_PUB_USER: ${{ secrets.MQTT_PUB_USER }}
          MQTT_PUB_PASS: ${{ secrets.MQTT_PUB_PASS }}
          CHANNEL: ${{ steps.release-meta.outputs.channel }}
        run: |
          set -euo pipefail
          : "${MQTT_BROKER_HOST:?Missing MQTT_BROKER_HOST}"
          : "${MQTT_PUB_USER:?Missing MQTT_PUB_USER}"
          : "${MQTT_PUB_PASS:?Missing MQTT_PUB_PASS}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          mosquitto_pub \
            -h "$MQTT_BROKER_HOST" \
            -p 31883 \
            -u "$MQTT_PUB_USER" \
            -P "$MQTT_PUB_PASS" \
            -t "andless/ota/dashboard/${CHANNEL}" \
            -q 1 \
            -r \
            -f manifest.json
          echo "Published retained update announcement to andless/ota/dashboard/${CHANNEL}"

      - name: Notify Feishu
        if: env.FEISHU_WEBHOOK_URL != ''
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          CHANNEL: ${{ steps.release-meta.outputs.channel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' manifest.json)"
          COMMIT="$(jq -r '.commit' manifest.json | cut -c1-7)"
          BUILD_TIME="$(jq -r '.build_time' manifest.json)"
          FORCE="$(jq -r '.force' manifest.json)"
          if [[ "$FORCE" == "true" ]]; then
            TITLE="🚨 Dashboard ${CHANNEL} v${VERSION}（强制更新）"
            TEMPLATE="red"
            FORCE_LINE=$'\n**更新策略**：强制更新，用户必须升级'
          else
            TITLE="🎉 Dashboard ${CHANNEL} v${VERSION} 发布"
            TEMPLATE="blue"
            FORCE_LINE=""
          fi
          CONTENT="$(
            printf '**版本**：v%s\n**渠道**：%s\n**Commit**：`%s`\n**构建时间**：%s%s\n\n[查看 CI 运行](%s)' \
              "$VERSION" "$CHANNEL" "$COMMIT" "$BUILD_TIME" "$FORCE_LINE" "$RUN_URL"
          )"
          jq -n \
            --arg title "$TITLE" \
            --arg template "$TEMPLATE" \
            --arg content "$CONTENT" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: {
                  title: { tag: "plain_text", content: $title },
                  template: $template
                },
                elements: [
                  { tag: "div", text: { tag: "lark_md", content: $content } }
                ]
              }
            }' > feishu.json
          RESPONSE="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data @feishu.json \
              "$FEISHU_WEBHOOK_URL"
          )"
          jq -e '(.code // .StatusCode // -1) == 0' <<< "$RESPONSE" >/dev/null

  publish-existing:
    name: Publish existing OSS release
    if: inputs.publish_existing == true
    needs:
      - resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: read
    steps:
      - name: Install ossutil v2
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_VERSION="2.2.1"
          ARCHIVE="$RUNNER_TEMP/ossutil-${OSSUTIL_VERSION}.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$ARCHIVE" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          OSSUTIL_DIR="$RUNNER_TEMP/ossutil-${OSSUTIL_VERSION}-linux-amd64"
          test -x "$OSSUTIL_DIR/ossutil"
          echo "$OSSUTIL_DIR" >> "$GITHUB_PATH"
          "$OSSUTIL_DIR/ossutil" version

      - name: Fetch and validate versioned manifest
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?Missing OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?Missing OSS_ACCESS_KEY_SECRET}"
          : "${OSS_BUCKET:?Missing OSS_BUCKET}"
          : "${OSS_ENDPOINT:?Missing OSS_ENDPOINT}"

          ENDPOINT_HOST="${OSS_ENDPOINT#http://}"
          ENDPOINT_HOST="${ENDPOINT_HOST#https://}"
          ENDPOINT_HOST="${ENDPOINT_HOST%/}"
          REGION="${ENDPOINT_HOST#oss-}"
          REGION="${REGION%%.*}"
          VERSION_MANIFEST="dashboard/release/versions/v${APP_VERSION}/manifest.json"

          ossutil cp \
            "oss://${OSS_BUCKET}/${VERSION_MANIFEST}" \
            manifest.json \
            --endpoint="$OSS_ENDPOINT" \
            --region="$REGION" \
            --force

          jq -e \
            --arg version "$APP_VERSION" \
            --arg commit "$SOURCE_SHA" \
            '.schema_version == 2
              and .app == "dashboard"
              and .channel == "release"
              and .version == $version
              and .commit == $commit
              and (.artifacts | length) > 0' \
            manifest.json >/dev/null
          echo "Validated dashboard v${APP_VERSION} manifest at ${VERSION_MANIFEST}"

      - name: Publish latest manifest
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          ENDPOINT_HOST="${OSS_ENDPOINT#http://}"
          ENDPOINT_HOST="${ENDPOINT_HOST#https://}"
          ENDPOINT_HOST="${ENDPOINT_HOST%/}"
          REGION="${ENDPOINT_HOST#oss-}"
          REGION="${REGION%%.*}"

          ossutil cp \
            "oss://${OSS_BUCKET}/dashboard/release/versions/v${APP_VERSION}/manifest.json" \
            "oss://${OSS_BUCKET}/dashboard/release/latest.json" \
            --endpoint="$OSS_ENDPOINT" \
            --region="$REGION" \
            --force

      - name: Announce new version via MQTT
        shell: bash
        env:
          MQTT_BROKER_HOST: ${{ secrets.MQTT_BROKER_HOST }}
          MQTT_PUB_USER: ${{ secrets.MQTT_PUB_USER }}
          MQTT_PUB_PASS: ${{ secrets.MQTT_PUB_PASS }}
        run: |
          set -euo pipefail
          : "${MQTT_BROKER_HOST:?Missing MQTT_BROKER_HOST}"
          : "${MQTT_PUB_USER:?Missing MQTT_PUB_USER}"
          : "${MQTT_PUB_PASS:?Missing MQTT_PUB_PASS}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          mosquitto_pub \
            -h "$MQTT_BROKER_HOST" \
            -p 31883 \
            -u "$MQTT_PUB_USER" \
            -P "$MQTT_PUB_PASS" \
            -t "andless/ota/dashboard/release" \
            -q 1 \
            -r \
            -f manifest.json
          echo "Published retained update announcement to andless/ota/dashboard/release"
